name: Factory

# Started by the app repos when an issue gets the ready label. Can also be
# started by hand from the Actions tab.
on:
  repository_dispatch:
    types: [issue-ready]
  workflow_dispatch:
    inputs:
      repo:
        description: App repo, for example owner/name
        required: true
      issue:
        description: Issue number
        required: true

# actions: read lets the stale-worker sweep ask whether a run is still going.
permissions:
  contents: read
  actions: read

# One run per issue at a time. A second run for the same issue waits, then
# finds the ready label gone and stops.
concurrency:
  group: "issue-${{ github.event.client_payload.repo || inputs.repo }}-${{ github.event.client_payload.issue || inputs.issue }}"
  cancel-in-progress: false

run-name: "${{ github.event.client_payload.repo || inputs.repo }} #${{ github.event.client_payload.issue || inputs.issue }}"

jobs:
  work:
    runs-on: ubuntu-latest
    # check-setup.mjs sums the worst case (wait 20 + 3 x command 25 + 2 x agent 30
    # = 155) and demands 10 minutes of margin over the work step's own limit, so
    # that step stops at 165. The job gets 10 more, so the recovery step below
    # still has time to free the worker and hand the issue back to a person when
    # the work step is killed by its limit.
    timeout-minutes: 175
    env:
      FACTORY_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      FACTORY_ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The workflow never pushes to this repo, so its token stays out of .git.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      # No secrets in this step's environment: dependency install scripts must
      # never see the tokens.
      - run: npm ci
      # Frees workers whose runs GitHub says are finished but never cleaned up.
      # It never touches a claim whose run is still queued or running.
      - name: Free workers left by finished runs
        if: vars.FACTORY_DRY_RUN != 'true'
        timeout-minutes: 5
        env:
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reap-stale.mjs
      - name: Show the plan
        env:
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          # The agents' sign-in secrets, by name. A new agent type or repo secret
          # in factory.config.json needs its line here too: test/workflow.test.mjs
          # fails until it is added, and a run without it stops with a comment
          # naming the missing secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: node src/plan.mjs
      # Set the repo variable FACTORY_DRY_RUN to true to stop after the plan. Useful
      # while proving the trigger, before any agent is allowed to run.
      - name: Do the work and open a pull request
        if: vars.FACTORY_DRY_RUN != 'true'
        timeout-minutes: 165
        env:
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          # The agents' sign-in secrets, by name. A new agent type or repo secret
          # in factory.config.json needs its line here too: test/workflow.test.mjs
          # fails until it is added, and a run without it stops with a comment
          # naming the missing secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          # Where src/run.mjs writes the run's JSON record (src/report.mjs runRecord).
          FACTORY_RUN_RECORD: ${{ runner.temp }}/factory-run.json
        run: node src/run.mjs
      # The record of this run, kept for 90 days. No secret values are in it.
      - name: Keep the run record
        if: always() && vars.FACTORY_DRY_RUN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-run-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-run.json
          if-no-files-found: ignore
          retention-days: 90
      # Runs when the work step failed, timed out or was cancelled. It only acts on
      # a Box that still carries this run's label, so after a clean failure (which
      # releases its own worker) it does nothing.
      - name: Free the worker after an interrupted run
        if: (failure() || cancelled()) && vars.FACTORY_DRY_RUN != 'true'
        timeout-minutes: 5
        env:
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: node scripts/recover-run.mjs
